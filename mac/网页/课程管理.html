/* —— Mac 宽屏：课表多列、行更紧凑；点开课程只显示必要信息 —— */
main{max-width:1560px;padding:22px 24px}

#form h2{cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}

   if(r.ok){if(weekMode===week)applyWeek(out);$('hint').textContent=(out.added?.length?'已新建学生：'+out.added.join('、')+'。':'')+(ignored?'已保存。这一周只能改时间、取消或加临时课；老师和课时请在“固定课表”里改。':'已保存，只影响这一周，固定课表没变。');return}
   if(r.status===409){alert('这一周刚在别的窗口里改过，这一下的改动没有保存。\n\n点“好”会刷新成最新的样子，请再改一次。');await setWeek(week);$('hint').textContent=(out.error||'这一周刚被别处改过')+'，已刷新，请重新操作。';return}

<script>
// ===== 授课方式：单师 / 双师轮流 / 双师一同；每次扣 1 或 2 课时 =====
// 试用版：老师名字来自设置向导（window.LESSON_TEACHERS）；只有一位老师时不显示红色
const LT=window.LESSON_TEACHERS||null;
const TEACHERS=[{key:'red',name:(LT&&LT.red)||'红老师',color:'#d45858'},{key:'blue',name:(LT&&LT.blue)||'蓝老师',color:'#4778d8'}].filter(t=>!LT||LT[t.key]);
setTimeout(()=>{paintViewTeacher();$('viewteacher')&&($('viewteacher').onchange=e=>{viewTeacher=e.target.value;try{localStorage.setItem('view-teacher',viewTeacher)}catch(x){}render()});if(viewTeacher!=='*')render()},0);
const tname=k=>k==='both'?'两位老师一起':(TEACHERS.find(x=>x.key===k)?.name||k);
const newTeacher=(()=>{let v='blue';try{v=localStorage.getItem('coda-new-teacher')||'blue'}catch(e){}return TEACHERS.some(x=>x.key===v)?v:'blue'})();
let setup={mode:'single',teacher:newTeacher,left:'red',right:'blue',cut:30,units:1};
const segHTML=(items,cur,attr)=>items.map(([v,l,c])=>'<button type="button" '+attr+'="'+v+'" aria-pressed="'+(String(cur)===String(v))+'"'+(c?' style="--dot:'+c+'"':'')+'>'+(c?'<i class="dot"></i>':'')+l+'</button>').join('');
function courseMinutes(){const d=Number($('duration').value);return d>0?d:45}
const SHORT=k=>k==='both'?'一起':(TEACHERS.find(x=>x.key===k)?.name||k).replace('老师','');
const PAINT=k=>k==='both'?'linear-gradient(90deg,#bf4141 50%,#3465c0 50%)':({red:'#bf4141',blue:'#3465c0'}[k]||(TEACHERS.find(x=>x.key===k)?.color)||'#3465c0');
function dualNote(r){
 if(!r.dual)return '';const L=r.dual.left,R=r.dual.right;
 if(L==='both'&&R==='both')return '<small class="dualnote">两位老师一起</small>';
 const dur=minutes(r.end)-minutes(r.start),cut=r.dual.minutes;

function paintSetup(){

 $('coursesetup').hidden=baseCourse;
 $('form').dataset.mode=weekMode?(edit?(baseCourse?'weekedit':'tempedit'):'tempadd'):(edit?'edit':'add');
 const dur=courseMinutes(),tchoices=TEACHERS.map(x=>[x.key,x.name,x.color]),side=tchoices.concat([['both','一起']]);

 $('singleteacher').innerHTML=segHTML(tchoices,setup.teacher,'data-st');
 $('leftteacher').innerHTML=segHTML(side,setup.left,'data-l');$('rightteacher').innerHTML=segHTML(side,setup.right,'data-r');

 const bar=$('setupbar'),start=$('start').value,t0=start?minutes(start):null,hm=v=>clock(v);
 if(setup.mode==='single'){bar.hidden=true;bar.innerHTML=''}
 else{
  bar.hidden=false;
  const part=(k,from,len)=>'<div style="flex:'+len+';background:'+PAINT(k)+'"><b>'+SHORT(k)+'</b>'+(t0==null?len+' 分钟':hm(t0+from)+'–'+hm(t0+from+len))+'</div>';
  bar.innerHTML=setup.mode==='together'?'<div style="flex:1;background:'+PAINT('both')+'"><b>两位老师一起</b>'+(t0==null?dur+' 分钟':hm(t0)+'–'+hm(t0+dur))+'</div>':part(setup.left,0,setup.cut)+part(setup.right,setup.cut,dur-setup.cut);

$('coursesetup').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.m){if(d.m==='rotate'&&setup.mode!=='rotate'){const dur=courseMinutes(),other=TEACHERS.find(x=>x.key!==setup.teacher)?.key||'red';setup.cut=Math.max(15,Math.floor(dur/30)*15);setup.left=setup.teacher;setup.right=other}setup.mode=d.m}else if(d.st)setup.teacher=d.st;else if(d.l)setup.left=d.l;else if(d.r)setup.right=d.r;else if(d.c)setup.cut=Number(d.c);else if(d.u)setup.units=Number(d.u);

};
// 正在编辑一节已有的课：改老师、扣几课时、授课方式，点了就存（以前要再点一次卡片才存，新用户不知道；10-19）
// 10-20：编辑班课时，学生框里少了人，以前会悄悄把这些人从课表里去掉。现在自动保存遇到这种情况先不存，点保存时再问
function droppedNames(name){const r=rows.find(x=>x.id===edit);if(!r)return [];const now=name.split(/[、,，\s]+/).filter(Boolean);return (r.studentNames||[]).filter(n=>!now.includes(n))}

// 10-20：同一位老师、或同一个学生，同一时间排了两节课，加课时先问一下（新老师测试时排重了没发现）
function clashes(row){const a=minutes(row.start),b=minutes(row.end),who=new Set(row.teachers||[row.teacher]),kids=new Set(row.studentNames||[]);
 return rows.filter(r=>r.id!==row.id&&r.day===row.day&&minutes(r.start)<b&&a<minutes(r.end)).flatMap(r=>{const out=[],same=(r.studentNames||[]).filter(n=>kids.has(n));

  else if((r.teachers||[r.teacher]).some(t=>who.has(t)))out.push(r.day+' '+r.start+'–'+r.end+' 这位老师已经在上「'+r.name+'」');
  return out})}
function buildRow(name){

 else if(setup.mode==='rotate'){teacher=setup.left==='both'?setup.right:setup.left;if(teacher==='both')teacher=all[0];teachers=[...new Set([setup.left,setup.right].flatMap(c=>c==='both'?all:[c]))];dual={minutes:Math.min(setup.cut,dur-15),left:setup.left,right:setup.right}}
 else{teachers=all;teacher=all[0];dual={minutes:15,left:'both',right:'both'}}

}
function loadSetup(r){
 for(const c of [r.teacher,r.dual?.left,r.dual?.right,...(r.teachers||[])])if(c&&c!=='both'&&!TEACHERS.some(x=>x.key===c))TEACHERS.push({key:c,name:(colorNames[c]||c)+'老师',color:colors[c]||'#888'});

 if(!r.dual){setup.mode='single';setup.teacher=r.teacher||'blue'}

}

<script>
// ---- 临时安排：按住一节课半秒（或右键）弹出菜单：给这一周的某位学生记“上课了”（直接扣课时）或标“请假”（只是标记）
// 上课了 用的流水编号和签课表那一行一样，以后在纸上签了字也不会重复扣
const leaveMenu=document.createElement('div');leaveMenu.className='leavemenu';leaveMenu.hidden=true;document.body.appendChild(leaveMenu);
const leaveOf=id=>(weekMode&&weekPayload&&weekPayload.leave&&weekPayload.leave[id])||{};
const bookedOf=id=>(weekMode&&weekPayload&&weekPayload.booked&&weekPayload.booked[id])||{};
function paintLeave(){
 if(!weekMode)return;
 document.querySelectorAll('#schedule .row[data-id]').forEach(el=>{
  const r=rows.find(x=>x.id===el.dataset.id);if(!r)return;
  const marks=leaveOf(r.id),booked=bookedOf(r.id),solo=people(r).length===1,tags=[];
  const done=Object.keys(booked).filter(n=>booked[n]==='lesson'),off=Object.keys(booked).filter(n=>booked[n]==='leave'),marked=Object.keys(marks).filter(n=>!booked[n]);
  if(done.length)tags.push(['done',(solo?'':done.join('、')+' ')+'已记上课']);
  if(off.length)tags.push(['leave',(solo?'':off.join('、')+' ')+'已记请假']);
  if(marked.length)tags.push(['leave',(solo?'':marked.join('、')+' ')+'请假']);
  let at=el.querySelector('.name');
  for(const [cls,text] of tags){const t=document.createElement('small');t.className='chg '+cls;t.textContent=text;at?.after(t);at=t}
 });
}
const _renderLeave=render;render=function(...a){const out=_renderLeave.apply(this,a);paintLeave();return out};
// 菜单作用的那一周：临时安排里是选中的那周；固定课表里是本周（固定课表这节课本周实际那一次）
let menuCtx=null;
async function openLessonMenu(el,x,y){
 let week=weekMode,payload=weekPayload;
 if(!weekMode){
  week=mondayISO(codaNow());
  try{const res=await fetch('/api/adjust?week='+week,{cache:'no-store'});payload=await res.json();if(!res.ok)throw new Error(payload.error)}catch(e){$('hint').textContent='读取本周课表失败：'+(e.message||'请重试');return}
 }
 const r=payload.effective.find(q=>q.id===el.dataset.id);
 if(!r){$('hint').textContent=weekMode?'这节课还没保存好，稍等一下再操作。':'这节课本周停了（或还没保存好），没有可记的。';return}
 const marks=payload.leave?.[r.id]||{},booked=payload.booked?.[r.id]||{},date=addDays(week,days.indexOf(r.day)).slice(5).replace('-','/');
 leaveMenu.innerHTML='<div>'+(weekMode?'':'本周 ')+r.day+' '+date+' '+r.start+'–'+r.end+'</div>'+people(r).map(n=>{
  if(booked[n])return '<div>'+esc(n)+'：'+({lesson:'已记上课',noshow:'已记旷课'}[booked[n]]||'已记请假')+'（要改到课时管理撤销）</div>';
  return '<button type="button" data-attend="'+esc(n)+'">上课了：'+esc(n)+'（扣 '+(r.units||1)+' 节）</button><button type="button" data-noshow="'+esc(n)+'">旷课：'+esc(n)+'（扣 '+(r.units||1)+' 节）</button><button type="button" data-leave="'+esc(n)+'" data-on="'+(marks[n]?'':'1')+'">'+(marks[n]?'取消请假：':'请假：')+esc(n)+'</button>'}).join('');
 menuCtx={week,course:r.id};leaveMenu.hidden=false;
 const w=leaveMenu.offsetWidth,h=leaveMenu.offsetHeight;
 leaveMenu.style.left=Math.min(x,innerWidth-w-8)+'px';leaveMenu.style.top=Math.min(y,innerHeight-h-8)+'px';
}
document.addEventListener('contextmenu',e=>{const el=e.target.closest('#schedule .row[data-id]');if(!el)return;e.preventDefault();openLessonMenu(el,e.clientX,e.clientY)});
// 按住不动半秒：取消这次拖动，弹出菜单（一动就还是拖动；单击还是打开编辑）
let hold=null;
document.addEventListener('pointerdown',e=>{
 clearTimeout(hold?.timer);hold=null;
 const el=e.button===0&&!e.target.closest('.grip')&&e.target.closest('#schedule .row[data-id]');if(!el)return;
 hold={x:e.clientX,y:e.clientY,timer:setTimeout(()=>{if(dnd&&!dnd.moved){dndCleanup(dnd);dnd=null}hold=null;openLessonMenu(el,e.clientX,e.clientY)},500)};
});
document.addEventListener('pointermove',e=>{if(hold&&Math.hypot(e.clientX-hold.x,e.clientY-hold.y)>=6){clearTimeout(hold.timer);hold=null}});
document.addEventListener('pointerup',()=>{if(hold){clearTimeout(hold.timer);hold=null}});
document.addEventListener('pointerdown',e=>{if(!leaveMenu.hidden&&!leaveMenu.contains(e.target))leaveMenu.hidden=true},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')leaveMenu.hidden=true});
leaveMenu.onclick=async e=>{
 const b=e.target.closest('[data-leave],[data-attend],[data-noshow]');if(!b)return;leaveMenu.hidden=true;
 const {week,course}=menuCtx||{},noshow=b.dataset.noshow!==undefined,attend=noshow||b.dataset.attend!==undefined,student=noshow?b.dataset.noshow:attend?b.dataset.attend:b.dataset.leave,on=!!b.dataset.on;
 try{
  const res=await fetch(attend?'/api/attend':'/api/leave/set',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':'@@LOCAL_KEY@@'},body:JSON.stringify({week,course,student,on,by:'Mac',kind:noshow?'noshow':'lesson'})});
  const out=await res.json().catch(()=>({}));
  if(!res.ok){$('hint').textContent=(attend?'没记上：':'没标上：')+(out.error||'请重试');return}
  if(weekMode===week&&weekPayload){weekPayload.leave=out.leave;weekPayload.booked=out.booked;render()}
  $('hint').textContent=(weekMode?'':'（本周 '+week.slice(5).replace('-','/')+' 起）')+(attend?student+(noshow?' 已记旷课':' 已记上课')+'，扣 '+out.units+' 节。以后纸上签了字也不会重复扣；记错了到课时管理的流水里撤销。':student+(on?' 已标请假（只是标记，不扣课时）。签课表核对时：纸上勾了请假就算请假；纸上没勾会请你确认。':' 的请假标记已取消。'));
 }catch(err){$('hint').textContent='连接服务不可用，没记上。'}
};
</script>

<style>
#freedlg{width:min(980px,96vw);border:0;border-radius:18px;padding:20px 24px;box-shadow:0 12px 40px #0003}
#freedlg::backdrop{background:#0006}
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 14px}

.fbar .seg button[aria-pressed=true]{background:#223047;color:#fff;border-color:#223047}
.fday{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:7px 0;border-top:1px solid #f0f2f6}
.fday b{font-size:15px}.fday small{color:#8190a4;display:block}
.ftrack{position:relative;height:26px;background:#e3f4ea;border-radius:7px;overflow:hidden}
.ftrack i{position:absolute;top:0;bottom:0;background:#c8ced8}
.ftrack i.busy-other{background:#e4e8ef}
.ftext{font-size:14px;color:#2f8f5b;margin-top:4px}.ftext.full{color:#8190a4}
.fhours{font-size:13px;color:#68788d}.fhours input{width:52px;font:inherit;padding:3px 5px;border:1px solid #dce1e9;border-radius:6px}
#freetext{width:100%;min-height:120px;margin-top:12px;font:15px/1.7 -apple-system,'PingFang SC',sans-serif;border:1px solid #dce1e9;border-radius:10px;padding:8px 10px}

<dialog id="freedlg">
 <div style="display:flex;align-items:center;gap:10px"><b style="font-size:19px">空档</b><span class="muted" style="color:#8190a4;font-size:13px">灰色＝已经排了课，绿色＝空着（只列 30 分钟以上）</span><span style="flex:1"></span><button type="button" id="freeclose" style="font:inherit;border:1px solid #dce1e9;border-radius:10px;padding:6px 12px;background:#fff">关闭</button></div>
 <div class="fbar">
  <select id="freewho"></select>
  <span class="seg" id="freeweek"></span>
  <span style="flex:1"></span>
  <button type="button" id="freecopy" style="background:#275de0;color:#fff;border-color:#275de0">复制空档（发微信）</button>
 </div>
 <div class="fhours" id="freehours"></div>
 <div id="freedays" style="margin-top:8px"></div>
 <textarea id="freetext" spellcheck="false"></textarea>
</dialog>
<script>
// ===== 空档：选老师和哪一周，按工作时间算出还空着的时间段，可以复制成文字发微信 =====
// 工作时间（用户 10-17 定）：周一到周五 10:00–20:00，周六 8:00–21:00，周日 8:00–20:00；窗口里可以改，记在这台电脑的浏览器里
const FREE_DEFAULT={wk:['10:00','20:00'],sat:['08:00','21:00'],sun:['08:00','20:00']};
let freeHours=(()=>{try{return Object.assign({},FREE_DEFAULT,JSON.parse(localStorage.getItem('free-hours')||'{}'))}catch(e){return {...FREE_DEFAULT}}})();
let freeWeekOff=1,freeTeacher=TEACHERS[0]?.key||'blue';
const hoursOf=i=>i<5?freeHours.wk:i===5?freeHours.sat:freeHours.sun;
const fmtD=iso=>{const d=new Date(iso+'T00:00:00');return (d.getMonth()+1)+'/'+d.getDate()};
// 一节课占用某位老师的时间段：双师轮流按前段/后段分开算，“一起”两位都占
function busyOf(r,t){
 const a=minutes(r.start),b=minutes(r.end),d=r.dual;
 if(d&&d.left==='both'&&d.right==='both')return [[a,b]];
 if(d){const m=a+(d.minutes||0),out=[];if(d.left===t||d.left==='both')out.push([a,m]);if(d.right===t||d.right==='both')out.push([m,b]);return out}
 return (r.teacher===t||(r.teachers||[]).includes(t))?[[a,b]]:[];
}
async function paintFree(){
 const week=addDays(mondayISO(codaNow()),7*freeWeekOff);
 $('freewho').innerHTML=TEACHERS.map(t=>'<option value="'+t.key+'"'+(t.key===freeTeacher?' selected':'')+'>'+t.name+'</option>').join('')+'<option value="*"'+(freeTeacher==='*'?' selected':'')+'>教室（所有老师都没课）</option>';
 $('freeweek').innerHTML=[['本周',0],['下周',1],['下下周',2]].map(([l,o])=>'<button type="button" data-off="'+o+'" aria-pressed="'+(o===freeWeekOff)+'">'+l+' '+fmtD(addDays(mondayISO(codaNow()),7*o))+'–'+fmtD(addDays(mondayISO(codaNow()),7*o+6))+'</button>').join('');
 $('freehours').innerHTML='工作时间：周一到周五 <input data-h="wk0" value="'+freeHours.wk[0]+'">–<input data-h="wk1" value="'+freeHours.wk[1]+'">　周六 <input data-h="sat0" value="'+freeHours.sat[0]+'">–<input data-h="sat1" value="'+freeHours.sat[1]+'">　周日 <input data-h="sun0" value="'+freeHours.sun[0]+'">–<input data-h="sun1" value="'+freeHours.sun[1]+'">';
 let rowsW=[];try{const r=await fetch('/api/adjust?week='+week,{cache:'no-store'});rowsW=(await r.json()).effective||[]}catch(e){$('freedays').innerHTML='读取课表失败';return}
 const now=codaNow(),today=now.toLocaleDateString('sv'),nowMin=now.getHours()*60+now.getMinutes();
 const tname=freeTeacher==='*'?'琴行':(TEACHERS.find(t=>t.key===freeTeacher)?.name||'');
 const lines=[tname+(freeWeekOff===0?' 本周':freeWeekOff===1?' 下周':' 下下周')+'（'+fmtD(week)+'–'+fmtD(addDays(week,6))+'）可以约的时间：'];let html='';
 days.forEach((day,i)=>{
  const date=addDays(week,i),[hs,he]=hoursOf(i).map(minutes);let from=hs;
  if(date<today)return;if(date===today)from=Math.max(hs,Math.ceil(nowMin/15)*15);
  const lessons=rowsW.filter(r=>r.day===day);
  const busy=lessons.flatMap(r=>freeTeacher==='*'?[[minutes(r.start),minutes(r.end)]]:busyOf(r,freeTeacher)).sort((a,b)=>a[0]-b[0]);
  const free=[];let cur=from;for(const [a,b] of busy){if(a>cur)free.push([cur,Math.min(a,he)]);cur=Math.max(cur,b)}if(cur<he)free.push([cur,he]);
  const slots=free.filter(([a,b])=>b-a>=30);const span=he-hs||1,pct=v=>Math.max(0,Math.min(100,(v-hs)/span*100));
  html+='<div class="fday"><div><b>'+day+'</b><small>'+fmtD(date)+'</small></div><div><div class="ftrack">'+(from>hs?'<i class="busy-other" style="left:0;width:'+pct(from)+'%"></i>':'')+busy.map(([a,b])=>'<i style="left:'+pct(a)+'%;width:'+(pct(b)-pct(a))+'%"></i>').join('')+'</div>'
   +'<div class="ftext'+(slots.length?'':' full')+'">'+(slots.length?slots.map(([a,b])=>clock(a)+'–'+clock(b)).join('、'):'已排满')+'</div></div></div>';
  if(slots.length)lines.push(day+' '+fmtD(date)+'：'+slots.map(([a,b])=>clock(a)+'–'+clock(b)).join('、'));
 });
 $('freedays').innerHTML=html||'<div style="color:#8190a4;padding:10px 0">这一周已经过去了</div>';
 $('freetext').value=lines.length>1?lines.join('\n'):tname+' 这一周已经排满了';
}
$('freebtn').onclick=()=>{$('freedlg').showModal();paintFree()};
$('freeclose').onclick=()=>$('freedlg').close();
$('freewho').onchange=()=>{freeTeacher=$('freewho').value;paintFree()};
$('freeweek').onclick=e=>{const b=e.target.closest('[data-off]');if(b){freeWeekOff=+b.dataset.off;paintFree()}};
$('freehours').onchange=e=>{const i=e.target.closest('[data-h]');if(!i||!/^\d{1,2}:\d{2}$/.test(i.value.trim()))return;const k=i.dataset.h.slice(0,-1),n=+i.dataset.h.slice(-1);freeHours[k]=freeHours[k].slice();freeHours[k][n]=i.value.trim().padStart(5,'0');try{localStorage.setItem('free-hours',JSON.stringify(freeHours))}catch(err){}paintFree()};
$('freecopy').onclick=async()=>{try{await navigator.clipboard.writeText($('freetext').value);$('freecopy').textContent='已复制 ✓';setTimeout(()=>$('freecopy').textContent='复制空档（发微信）',1500)}catch(e){$('freetext').select()}};

// 11-01 老师定：首页顶上提醒“有 X 张签课表待入账”，点一下进课时管理的核对；入账仍只由老师点
(async()=>{try{const d=await (await fetch('/api/sheets',{cache:'no-store'})).json(),n=(d.pending||[]).length,el=document.getElementById('pendbanner');if(n){el.textContent='有 '+n+' 张签课表待入账，点这里去核对 ›';el.hidden=false;el.style.display='block'}}catch(e){}})();
</script>
