<script>
let phoneTeacher=(()=>{let value;try{value=localStorage.getItem('lesson-phone-filter')}catch(e){}value=value||window.__lessonTeacher;return ['all','red','blue'].includes(value)?value:'all'})();
window.setPhoneFilter=setPhoneFilter;
function setPhoneFilter(value){
 phoneTeacher=value;try{localStorage.setItem('lesson-phone-filter',value)}catch(e){}window.__lessonTeacher=value;
 if(window.webkit?.messageHandlers?.lessonNative)nativeMobile('setTeacher',{teacher:value});
 renderPhoneSchedule();
}

function renderPhoneSchedule(){
 document.querySelector('header').style.display='none';document.querySelector('nav').style.display='none';$('editdevice').parentElement.style.display='none';$('foot').style.display='none';document.body.style.background=phoneTeacher==='blue'?'#edf3ff':phoneTeacher==='red'?'#fff0f0':'#ffffff';
 // 从今天起 7 天实际要上的课（服务端已算好临时安排）：r[8] 变动 move/add/cancel，r[9] 日期
 const days=initial.dates,tag={move:'改时间',add:'临时',cancel:'停课'};
 const color=c=>c==='red'?'#cf4747':c==='both'?'linear-gradient(90deg,#cf4747 50%,#3e70cb 50%)':'#3e70cb';
 const badge=(time,teacher)=>'<span class="phoneTime"><i aria-hidden="true" style="background:'+color(teacher)+'"></i>'+esc(time)+'</span>';
 const myStart=r=>{const d=r[6],b=timeBounds(r);if(!b)return 0;if(!d||phoneTeacher==='all')return b[0];return (d.left===phoneTeacher||d.left==='both')?b[0]:b[0]+d.minutes};
 $('view').innerHTML='<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button type="button" id="phoneRefresh">刷新</button></div><div class="phoneDays">'+days.map(({date,day},di)=>{
 const rows=schedule.filter(r=>r[9]===date&&!r[7]&&r[2]!=='练习'&&r[3]!=='基本功'&&(phoneTeacher==='all'||(r[6]?[r[6].left,r[6].right]:[r[4]]).some(c=>c===phoneTeacher||c==='both'))).sort((a,b)=>myStart(a)-myStart(b)||a[1].localeCompare(b[1]));if(!rows.length)return '';
 return '<section class="phoneDay"><h3>'+date.slice(5).replace('-','/').replace(/^0/,'')+' '+day+(di===0?' <small class="phoneToday">今天</small>':'')+'</h3>'+rows.map(r=>{
 const dual=r[6],bounds=timeBounds(r);let times=badge(r[1],r[4]);
 if(dual&&bounds&&dual.left==='both'&&dual.right==='both'){times=badge(r[1],'both')}else if(dual&&bounds){const split=bounds[0]+dual.minutes;times=[{time:clock(bounds[0])+'–'+clock(split),teacher:dual.left},{time:clock(split)+'–'+clock(bounds[1]),teacher:dual.right}].filter(p=>phoneTeacher==='all'||p.teacher===phoneTeacher||p.teacher==='both').map(p=>badge(p.time,p.teacher)).join('')}
 const mark=r[8]?'<em class="phoneTag'+(r[8]==='cancel'?' off':'')+'">'+tag[r[8]]+'</em>':'';
 if(r[8]==='cancel')return '<article class="phoneCourse cancelled"><div class="phoneRow"><div class="phoneTimes">'+times+'</div><span>'+esc(names(r).join('、'))+mark+'</span></div></article>';
 return '<article class="phoneCourse"><div class="phoneRow"><div class="phoneTimes">'+times+'</div><span>'+names(r).map(n=>{const done=(r[13]||{})[n],marked=(r[12]||[]).includes(n),off=done==='leave'||(!done&&marked);return '<button class="phoneStudent'+(off?' onleave':'')+'" data-student="'+esc(n)+'" data-student-id="'+esc(db.studentIds?.[n]||n)+'" data-course="'+esc(r[10]||'')+'" data-week="'+esc(r[11]||'')+'" data-date="'+esc(r[9])+'" data-time="'+esc(r[1])+'" data-units="'+(r[5]||1)+'" data-booked="'+(done||'')+'" data-marked="'+(marked?'1':'')+'" style="border:0;background:none;padding:4px;font:inherit;color:inherit">'+esc(n)+(done==='lesson'?'<em class="phoneTag done">已上</em>':off?'<em class="phoneTag leave">请假</em>':'')+'</button>'}).join('、')+mark+'</span>'+'</div></article>';

 host.querySelectorAll('[data-student]').forEach(b=>{
  // 1.1 名字上的手势（10-18 用户定）：

// 按住名字之后的松手：挂在 window 的捕获阶段（比 App 注入的下拉刷新脚本更早），保证一定收得到
function nameDragEnd(){
 const d=window.__nameDrag;if(!d)return;window.__nameDrag=null;d.stop?.();nameChip(null);
 const b=d.b,last=d.last||{x:d.x0,y:d.y0},toBar=last.y>=innerHeight-70;
 window.__nameDragJustEnded=Date.now();
 if(d.stage===2){nativeMobile('voiceStop');return}                      // 一直按着在说话：松手保存
 const item=menuItemAt(last.x,last.y);hotMenuItem(null);
 if(item&&d.moved){item.click();return}                                  // 滑到菜单某一项松手＝选它
 if(toBar){hideLessonMenu();nativeMobile('pinNote',{name:b.dataset.student,studentId:b.dataset.studentId});return}  // 拖到底部＝打字
 if(!d.moved){nativeMobile('pinNote',{name:b.dataset.student,studentId:b.dataset.studentId,focus:false});return}  // 原地松手＝菜单留着点
 hideLessonMenu();
}
if(!window.__nameDragHooked){window.__nameDragHooked=true;addEventListener('touchend',nameDragEnd,true);addEventListener('touchcancel',nameDragEnd,true)}
function menuItemAt(x,y){const m=$('lessonmenu');if(!m||m.hidden)return null;const el=document.elementFromPoint(x,y);return el&&m.contains(el)?el.closest('[data-kind]'):null}
function hotMenuItem(item){const m=$('lessonmenu');if(!m)return;m.querySelectorAll('[data-kind]').forEach(x=>x.style.background=x===item?'#dbe6ff':'');if(item&&item!==window.__hot)nativeMobile('haptic',{style:'light'});window.__hot=item}
function hideLessonMenu(){const m=$('lessonmenu');if(m)m.hidden=true}
// 按住名字时底部的提示条；拖动时名字变成小标签跟着手指走。name 为 null＝收起；showChip=false＝只亮提示条
function nameChip(name,x,y,showChip){
 let c=$('namechip'),bar=$('namebar');
 if(!c){c=document.createElement('div');c.id='namechip';c.style.cssText='position:fixed;z-index:80;pointer-events:none;background:#245bd3;color:#fff;border-radius:16px;padding:6px 14px;font-size:17px;font-weight:600;box-shadow:0 6px 18px #0004;transform:translate(-50%,-140%)';document.body.appendChild(c);
  bar=document.createElement('div');bar.id='namebar';bar.style.cssText='position:fixed;left:0;right:0;bottom:0;height:70px;z-index:79;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:#245bd3;background:linear-gradient(transparent,#dbe6ff);transition:opacity .15s;text-align:center;padding:0 10px';document.body.appendChild(bar)}
 if(!name){c.hidden=true;bar.style.opacity=0;return}
 const near=y>=innerHeight-70,moved=window.__nameDrag?.moved;c.hidden=!(showChip&&moved);c.textContent=name;c.style.left=x+'px';c.style.top=y+'px';c.style.background=near?'#2f8f5b':'#245bd3';
 bar.style.opacity=1;bar.textContent=near?'松手：打字记给 '+name:moved?'滑到菜单选一项 · 拖到这里打字记给 '+name:'继续按住＝说话记给 '+name+' · 滑到菜单选一项';bar.style.fontWeight=near?'700':'400';
}

// 按住学生名字弹出的菜单（出现在手指上方，手指不挡字）；点了或滑过去松手，交给 App 转给 Mac，成功后 App 会重新读课表
function openLessonMenu(b,x,y){
 let m=$('lessonmenu');if(!m){m=document.createElement('div');m.id='lessonmenu';m.className='leavemenu';document.body.appendChild(m);
  document.addEventListener('touchstart',e=>{if(!m.hidden&&!m.contains(e.target))m.hidden=true},true)}
 const mates=[...b.parentElement.querySelectorAll('[data-student]:not(.onleave)')].map(x=>({name:x.dataset.student,id:x.dataset.studentId}));  // 同一行＝同一节课的学生；请假的不算
 const d=b.dataset,n=esc(d.student),day=(d.date||'').slice(5).replace('-','/').replace(/^0/,'');
 // 全班上课了（请假的、已记的不算）
 const today=(typeof initial!=='undefined'&&initial.dates&&initial.dates[0]&&initial.dates[0].date)||'',future=!!(d.date&&today&&d.date>today);
 const todo=[...b.parentElement.querySelectorAll('[data-student]:not(.onleave)')].filter(x=>!x.dataset.booked).map(x=>x.dataset.student);
 m.innerHTML='<div>'+n+(day?' · '+day+' '+esc(d.time||''):'')+'</div>'
  +(!d.course?'':d.booked?'<div>'+(d.booked==='lesson'?'已记上课':'已记请假')+'（要改到 Mac 课时管理撤销）</div>':
   '<button type="button" data-kind="attend">上课了（扣 '+(Number(d.units)||1)+' 节）</button><button type="button" data-kind="leave">'+(d.marked?'取消请假':'请假')+'</button>')
  +(mates.length>1&&d.course&&!future&&todo.length?'<button type="button" data-kind="attendall">全班上课了（'+todo.length+' 人，各扣 '+(Number(d.units)||1)+' 节）</button>':'')
  +'<button type="button" data-kind="type">打字记给 '+n+'</button>';
 m.onclick=e=>{const k=e.target.closest('[data-kind]');if(!k)return;m.hidden=true;

  nativeMobile('lessonAction',{kind:k.dataset.kind,week:d.week,course:d.course,student:d.student,on:k.dataset.kind==='attend'||!d.marked,units:Number(d.units)||1})};
 m.hidden=false;const w=m.offsetWidth,h=m.offsetHeight;
 m.style.left=Math.max(8,Math.min(x-w/2,innerWidth-w-8))+'px';m.style.top=(y-h-30>=8?y-h-30:Math.min(y+40,innerHeight-h-8))+'px';

function cachePhoneSchedule(){
 const who=n=>({id:db.studentIds?.[n]||n,name:n});

 const dates=Object.fromEntries(Object.entries(db.dateSchedules||{}).map(([date,c])=>[date,{replace:!!c.replace,courses:(c.courses||[]).map(r=>({id:r.id,time:r.time,teacher:r.teacher,students:r.names.filter(n=>studentState(n)==='active').map(who)}))}]));
 nativeMobile('noteContext',{context:{lessons,dates,roster:students.filter(n=>studentState(n)==='active').map(n=>({...who(n),teachers:[...new Set(schedule.filter(r=>!r[7]&&names(r).includes(n)).flatMap(r=>r[6]?[r[6].left,r[6].right]:[r[4]]))].join(',')}))}});
 window.phoneCaching=true;const original=phoneTeacher,pages={};
 try{
 for(const filter of ['all','blue','red']){phoneTeacher=filter;renderPhoneSchedule();pages[filter]=$('view').innerHTML}
 phoneTeacher=original;renderPhoneSchedule();
 const payload=btoa(unescape(encodeURIComponent(JSON.stringify(pages))));
 const css=Array.from(document.querySelectorAll('style')).map(x=>x.textContent).join('\n');
 const script=`const pages=JSON.parse(decodeURIComponent(escape(atob('${payload}'))));let mode=window.__lessonTeacher||'all';
 function send(action,data={}){window.webkit.messageHandlers.lessonNative.postMessage({action,...data})}
 function show(){document.body.style.background=mode==='blue'?'#edf3ff':mode==='red'?'#fff0f0':'white';document.getElementById('view').innerHTML=pages[mode]||pages.all;document.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>send('pinNote',{name:b.dataset.student,studentId:b.dataset.studentId}));document.getElementById('phoneRefresh').onclick=()=>send('refreshSchedule')}
 function change(next){mode=next;send('setTeacher',{teacher:mode});show()}
 let start=null;document.ontouchstart=e=>{if(e.touches.length!==1){start=null;return}start={x:e.touches[0].clientX,y:e.touches[0].clientY,top:scrollY<=0}};document.ontouchend=e=>{if(!start)return;const p=start,t=e.changedTouches[0];start=null;if(!t)return;const x=t.clientX-p.x,y=t.clientY-p.y;if(x < -80&&Math.abs(y)<60)send('captureQueue');else if(p.top&&y>=80&&Math.abs(x)<50)change(mode==='blue'?'red':'blue')};document.ontouchcancel=()=>start=null;document.ondblclick=e=>{if(e.target.closest('button'))return;e.preventDefault();change('all')};show();`;
 nativeMobile('cacheSchedule',{html:'<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+css+'</style></head><body><main><section id="view"></section></main><scr'+'ipt>'+script+'</scr'+'ipt></body></html>'});
 }finally{phoneTeacher=original;window.phoneCaching=false}
}
